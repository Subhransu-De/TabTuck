<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TabTuck</title>
    <link rel="stylesheet" href="manage.css" />
    <link rel="icon" href="../icons/48.png" />
    <script type="module" src="manage.js"></script>
  </head>
  <body>
    <script src="boot.js"></script>
    <!-- The panels paint at once; React replaces them with the page. -->

      <div class="app" aria-busy="true">

          <div class="head brand-head">

              <img src="../icons/48.png" alt="" /><span class="brand-text"

          </div>

        <main class="col"></main>
      </div>
    </div>
