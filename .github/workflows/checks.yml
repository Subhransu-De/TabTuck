name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan full Git history
        run: '"$RUNNER_TEMP/gitleaks" git . --log-opts="--all" --redact --no-banner'
  check:
    needs: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun run check
      # web-ext currently depends on image-size 2.0.2, which has unpatched
      # parser DoS advisories. Report development-tool advisories without
      # treating them as production dependencies or hiding their output.
      - name: Dependency advisory report
        continue-on-error: true
        run: bun run audit:dependencies
      - name: Verify generated CSS is committed
        run: git diff --exit-code -- manage.css
      - name: Install test browser
        run: bunx playwright install --with-deps chromium
      - name: Browser workflow and restore checks
        run: |
          HELIUM_EXECUTABLE="$(bun -e 'import { chromium } from "playwright"; console.log(chromium.executablePath())')"
          export HELIUM_EXECUTABLE
          TABTUCK_TEST_DIR="$RUNNER_TEMP/tabtuck-workflows" bun run test:browser
          TABTUCK_TEST_DIR="$RUNNER_TEMP/tabtuck-restores" bun run test:restore
