name: Release
# Push a vX.Y.Z tag that matches src/manifest.json to release. Running the
# workflow by hand on a branch builds and audits the package without
# publishing; running it on an existing tag retries publication.
# Setup and the one-time manual store steps: wiki/releasing.md
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    name: Build and audit package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - name: Match tag to manifest version
        id: version
        run: |
          version="$(jq -r .version src/manifest.json)"
          package_version="$(jq -r .version package.json)"
          if [[ "$version" != "$package_version" ]]; then
            echo "::error::src/manifest.json is $version but package.json is $package_version"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile
      # Lint, tests, build, extension validation, and the package audit.
      - run: make check
      - name: Install pinned Gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan packaged files for secrets
        run: '"$RUNNER_TEMP/gitleaks" dir dist/TabTuck --redact --no-banner'
      - name: Name release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir dist/release
          cp dist/tabtuck.zip "dist/release/TabTuck-$VERSION.zip"
          (cd dist/release && sha256sum "TabTuck-$VERSION.zip" > SHA256SUMS)
      - name: Attest build provenance
        if: github.ref_type == 'tag'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/release/TabTuck-*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tabtuck-package
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30

  github-release:
    name: Publish GitHub release
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tabtuck-package
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release $GITHUB_REF_NAME already exists; its files are left unchanged."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "TabTuck $VERSION" \
            --generate-notes \
            --verify-tag

  chrome-web-store:
    name: Submit to Chrome Web Store
    needs: package
    # Skipped until the store item exists and the repository variables are set.
    if: github.ref_type == 'tag' && vars.CWS_EXTENSION_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Add a required reviewer to this environment to approve each submission.
    environment: chrome-web-store
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tabtuck-package
          path: dist
      # Workload Identity Federation: no long-lived key is stored in GitHub.
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
      - name: Upload and submit for review
        env:
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_PUBLISH_TYPE: ${{ vars.CWS_PUBLISH_TYPE }}
          VERSION: ${{ needs.package.outputs.version }}
        run: bun scripts/publish-chrome-web-store.ts "dist/TabTuck-$VERSION.zip" "$VERSION"
