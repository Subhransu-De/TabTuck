name: Release
# Start a release by hand on main. Leave the version empty for the next patch
# version. The workflow moves the Unreleased entries of CHANGELOG.md into a
# dated section, builds and audits the package, commits the version and
# changelog to main, tags it, publishes the GitHub release with that changelog
# section, then submits the package to the Chrome Web Store.
# Run it on an existing vX.Y.Z tag to retry publication. A dry run only builds
# and audits, on any branch.
# Setup and the one-time manual store steps: wiki/releasing.md
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version such as 1.4.0. Leave empty for the next patch version.
        type: string
        required: false
      dry_run:
        description: Dry run. Build and audit only; do not commit, tag or publish.
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  package:
    name: Build and audit package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      date: ${{ steps.version.outputs.date }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - name: Choose version and prepare changelog
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          date="$(date -u +%F)"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="$(bun scripts/release-version.ts current)"
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version."
              exit 1
            fi
            if [[ -n "$REQUESTED" && "${REQUESTED#v}" != "$version" ]]; then
              echo "::error::Leave the version empty, or enter $version, to retry tag $GITHUB_REF_NAME."
              exit 1
            fi
            echo "::notice::Retrying publication of $GITHUB_REF_NAME"
          else
            if [[ "$DRY_RUN" != true && "$GITHUB_REF" != refs/heads/main ]]; then
              echo "::error::Start releases from main, or run on an existing tag to retry one. Tick the dry run box to test another branch."
              exit 1
            fi
            version="$(bun scripts/release-version.ts next "$REQUESTED")"
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
              echo "::error::Tag v$version already exists. Choose a higher version, or run the workflow on that tag to retry it."
              exit 1
            fi
            bun scripts/release-version.ts apply "$version" "$date"
            echo "::notice::Releasing version $version"
          fi
          mkdir -p "$RUNNER_TEMP/notes"
          bun scripts/release-version.ts notes "$version" "$RUNNER_TEMP/notes/release-notes.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "date=$date" >> "$GITHUB_OUTPUT"
      - name: Require passing Checks on this commit
        if: ${{ !inputs.dry_run && github.ref_type == 'branch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh run list --repo "$GITHUB_REPOSITORY" --workflow checks.yml --commit "$GITHUB_SHA" \
              --event push --status success --json headSha --limit 20 | jq -e 'length > 0' >/dev/null; then
            echo "::error::Checks has not passed on $GITHUB_SHA. Wait for it to pass on main, then run the release again."
            exit 1
          fi
      - run: bun install --frozen-lockfile
      # Lint, formatting (including the prepared changelog), tests, build,
      # extension validation, and the package audit.
      - run: make check
      - name: Install pinned Gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan packaged files for secrets
        run: '"$RUNNER_TEMP/gitleaks" dir dist/TabTuck --redact --no-banner'
      - name: Name release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir dist/release
          cp dist/tabtuck.zip "dist/release/TabTuck-$VERSION.zip"
          (cd dist/release && sha256sum "TabTuck-$VERSION.zip" > SHA256SUMS)
      # A release started from main records main's commit as the source. The
      # release commit, which only adds the version and changelog date, is
      # created after the build.
      - name: Attest build provenance
        if: ${{ !inputs.dry_run }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/release/TabTuck-*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tabtuck-package
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes/release-notes.md
          if-no-files-found: error
          retention-days: 30

  github-release:
    name: Tag and publish GitHub release
    needs: package
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.package.outputs.version }}
      DATE: ${{ needs.package.outputs.date }}
    steps:
      # The commit the package was built from. Pushing the release commit
      # fails if main has moved since, so the release matches the package.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tabtuck-package
          path: ${{ runner.temp }}/package
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes
      # Skipped when retrying a tag, or on a rerun after a successful push.
      - name: Commit release version and create tag
        if: github.ref_type == 'branch'
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::notice::Tag v$VERSION already exists; skipping the release commit."
            exit 0
          fi
          bun scripts/release-version.ts apply "$VERSION" "$DATE"
          git add -- src/manifest.json package.json CHANGELOG.md
          git diff --cached --check
          git diff --cached
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --message "chore: release v$VERSION"
          git tag "v$VERSION"
          # Both refs move together. If main moved, neither is pushed.
          if ! git push --atomic origin HEAD:refs/heads/main "refs/tags/v$VERSION"; then
            echo "::error::Release push failed. main probably changed while this release was building; run it again."
            exit 1
          fi
      - name: Publish GitHub release
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release v$VERSION already exists; its files are left unchanged."
            exit 0
          fi
          gh release create "v$VERSION" "$RUNNER_TEMP"/package/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "TabTuck $VERSION" \
            --notes-file "$RUNNER_TEMP/notes/release-notes.md" \
            --verify-tag

  # A separate job keeps the store secrets out of the job that can write to
  # this repository.
  chrome-web-store:
    name: Submit to Chrome Web Store
    needs: [package, github-release]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The required reviewer on this environment approves each submission.
    # Every store and Google Cloud value is an environment secret, so only
    # this job can read them and the logs of this public repository mask them.
    environment: chrome-web-store
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.package.outputs.version }}
      HAS_STORE_SECRETS: ${{ secrets.CWS_EXTENSION_ID != '' && secrets.CWS_PUBLISHER_ID != '' && secrets.GCP_SERVICE_ACCOUNT != '' && secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
    steps:
      - name: Skip without store secrets
        if: env.HAS_STORE_SECRETS != 'true'
        run: echo "::notice::The chrome-web-store environment is missing store secrets, so v$VERSION was not submitted."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.HAS_STORE_SECRETS == 'true'
        with:
          ref: v${{ needs.package.outputs.version }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: env.HAS_STORE_SECRETS == 'true'
        with:
          bun-version: "1.4.0"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: env.HAS_STORE_SECRETS == 'true'
        with:
          name: tabtuck-package
          path: dist
      # Workload Identity Federation: no long-lived key is stored in GitHub.
      - name: Authenticate to Google Cloud
        if: env.HAS_STORE_SECRETS == 'true'
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
      - name: Upload and submit for review
        if: env.HAS_STORE_SECRETS == 'true'
        env:
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_PUBLISH_TYPE: ${{ secrets.CWS_PUBLISH_TYPE }}
        run: bun scripts/publish-chrome-web-store.ts "dist/TabTuck-$VERSION.zip" "$VERSION"
